<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Hunter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #dedcd3; --accent: #1f5f4a; --accent-ink: #ffffff;
    --me: #e4efe9; --err: #a32020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1f201e; --ink: #ecebe5; --muted: #9a998f;
      --line: #34352f; --accent: #5cb596; --accent-ink: #10201a;
      --me: #223a31; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); background: var(--panel); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header .who { color: var(--muted); font-size: 14px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent);
    outline-offset: 2px; }
  #signin { text-align: center; padding: 96px 0; }
  #signin h2 { font-size: 28px; margin: 0 0 8px; }
  #signin p { color: var(--muted); margin: 0 0 28px; }
  #signin button { padding: 12px 22px; font-size: 17px; }
  #app { display: flex; flex-direction: column; height: calc(100vh - 57px); }
  #log { flex: 1; overflow-y: auto; padding: 20px 0; }
  .msg { max-width: 88%; margin: 0 0 14px; padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap;
    overflow-wrap: anywhere; }
  .msg.me { margin-left: auto; background: var(--me); border-color: transparent; }
  .msg .by { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg.note { color: var(--muted); background: none; border: none; padding: 0 4px; }
  .msg.err { color: var(--err); background: none; border-color: var(--err); }
  form { display: flex; gap: 10px; padding: 12px 0 20px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; max-height: 200px; }
  #fatal { padding: 40px 0; color: var(--err); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border-color: transparent; background: none; color: var(--muted); }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--line);
    background: var(--bg); }
  #funnel { padding: 24px 0 40px; }
  #funnel .wide { max-width: 1040px; margin: 0 auto; }
  .fn-stage { background: #0c1019; border: 1px solid #1b2230; border-radius: 6px;
    padding: 18px 8px 8px; overflow-x: auto; color: #e8edf7; }
  .fn-stage svg { display: block; min-width: 760px; width: 100%; height: auto; }
  .fn-bar { display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
    font: 11px/1 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .12em; text-transform: uppercase; color: #7d889d; padding: 6px 14px 10px; }
  .fn-bar i { display: inline-block; width: 18px; height: 3px; border-radius: 2px;
    margin-right: 8px; vertical-align: middle; }
  .fn-bar button { margin-left: auto; background: transparent; color: #e8edf7;
    border-color: #1b2230; border-radius: 3px; padding: 6px 12px; font: inherit; }
  .fn-bar button:hover { border-color: #22d3ee; color: #22d3ee; }
  .fn-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px; background: #1b2230; border: 1px solid #1b2230; border-radius: 6px;
    overflow: hidden; margin-top: 16px; }
  .fn-stat { background: #0c1019; padding: 18px 20px; display: flex; flex-direction: column;
    gap: 8px; min-width: 0; color: #e8edf7; }
  .fn-stat span { font: 11px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .18em;
    text-transform: uppercase; color: #7d889d; }
  .fn-stat strong { font: 500 34px/1 Unbounded, "Arial Black", system-ui, sans-serif;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .fn-stat small { font: 12px "IBM Plex Mono", ui-monospace, monospace; color: #7d889d; }
  #fn-empty { padding: 56px 24px; text-align: center; color: #7d889d; }
  #fn-empty h2 { margin: 0 0 8px; color: #e8edf7; font-size: 22px; }
  .rib { transition: opacity .25s, fill-opacity .25s; fill-opacity: .5; }
  .rib:hover { fill-opacity: .9; }
  svg:has(.rib:hover) .rib:not(:hover) { opacity: .18; }
  .flow { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round;
    stroke-dasharray: 1 14; opacity: .55; pointer-events: none; }
  @keyframes drift { to { stroke-dashoffset: -45; } }
  @media (prefers-reduced-motion: no-preference) { .flow { animation: drift 2.4s linear infinite; } }
  .hd-n { font: 500 30px Unbounded, "Arial Black", system-ui, sans-serif; fill: #e8edf7; }
  .hd-l { font: 10.5px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .2em;
    fill: #7d889d; text-transform: uppercase; }
  .hd-p { font: 11px "IBM Plex Mono", ui-monospace, monospace; fill: #7d889d; }
  .ls-l { font: 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .12em;
    text-transform: uppercase; }
  .ls-n { font: 500 16px Unbounded, "Arial Black", system-ui, sans-serif; fill: #e8edf7; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Head Hunter</h1>
    <nav class="tabs" id="tabs" aria-label="Views" hidden>
      <button id="tab-chat" aria-pressed="true">Chat</button>
      <button id="tab-funnel" aria-pressed="false">Funnel</button>
    </nav>
    <span class="who" id="who"></span>
    <button id="new" hidden>New conversation</button>
    <button id="out" hidden>Sign out</button>
  </div>
</header>

<main class="wrap">
  <div id="fatal" role="alert" hidden></div>

  <section id="signin" hidden>
    <h2>Your career, on the record</h2>
    <p>Sign in so the Head Hunter can load your own profile.</p>
    <button class="primary" id="in">Sign in with Google</button>
    <p id="signin-error" role="alert" style="margin-top:20px;color:var(--err)"></p>
  </section>

  <section id="app" hidden>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <button type="button" id="attach" title="PDF, Word or text file, up to 5 MB">
        Upload resume</button>
      <input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden>
      <textarea id="box" rows="2" aria-label="Message" required
        placeholder="Say hello, paste a job description, or upload your resume"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>

  <section id="funnel" hidden>
    <div class="wide">
      <div id="fn-error" role="alert" style="color:var(--err);margin-bottom:12px" hidden></div>
      <div class="fn-stage">
        <div id="fn-empty" hidden>
          <h2>No applications yet</h2>
          <p>Tell the Coach in the chat when you apply, hear back, interview or get an
            answer, and the graph fills in.</p>
        </div>
        <svg id="fn-svg" viewBox="0 0 1000 500" role="img" aria-label="Application funnel"></svg>
        <div class="fn-bar">
          <span><i style="background:linear-gradient(90deg,#22d3ee,#ffc83d)"></i>Moved forward</span>
          <span><i style="background:#ff5636"></i>Rejected</span>
          <span><i style="background:#8b7bff"></i>Withdrew</span>
          <span><i style="background:#5a6479"></i>No response</span>
          <span><i style="background:#6aa8ff"></i>In progress</span>
          <button type="button" id="fn-replay">Replay</button>
        </div>
      </div>
      <div class="fn-stats" id="fn-stats"></div>
    </div>
  </section>
</main>

<script src="/funnel.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  const $ = (id) => document.getElementById(id);
  const show = (id, on) => { $(id).hidden = !on; };

  let sessionId = null;
  let auth = null;

  // Everything from the agent is inserted as plain text, never as markup:
  // a reply is model output, and a pasted job posting is someone else's text.
  function addMessage(text, kind, by) {
    const el = document.createElement("div");
    el.className = "msg " + (kind || "");
    if (by) {
      const label = document.createElement("span");
      label.className = "by";
      label.textContent = by;
      el.appendChild(label);
    }
    el.appendChild(document.createTextNode(text));
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
    return el;
  }

  function reset() {
    sessionId = null;
    $("log").replaceChildren();
    addMessage("Say hello to get started. Your profile is saved between visits.", "note");
  }

  const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;  // keep in step with doc_text.MAX_FILE_BYTES

  const idToken = () => auth.currentUser.getIdToken();  // refreshed when stale

  // Turn a failed response into an Error whose message is safe to show. A 401
  // means the token was refused, so sign out rather than leave a dead session.
  async function failure(res, fallback) {
    if (res.status === 401) {
      await signOut(auth);
      return new Error("Your sign-in was not accepted. Please sign in again.");
    }
    let detail = fallback;
    try {
      const body = await res.json();
      if (typeof body.detail === "string") detail = body.detail;
    } catch (_) {}
    return new Error(detail);
  }

  async function send(text) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + await idToken() },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (res.status === 404) {
      sessionId = null;
      throw new Error("That conversation could not be found. Send your message again to start a new one.");
    }
    if (!res.ok) throw await failure(res, "Something went wrong. Try again.");
    return res.json();
  }

  async function uploadResume(file) {
    if (file.size > MAX_UPLOAD_BYTES) {
      throw new Error("That file is larger than 5 MB, which is too big for a resume.");
    }
    const body = new FormData();
    body.append("file", file);
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: "Bearer " + await idToken() },
      body,
    });
    if (!res.ok) throw await failure(res, "That file could not be uploaded.");
    return res.json();
  }

  function setBusy(busy) {
    for (const id of ["box", "send", "attach"]) $(id).disabled = busy;
    if (!busy) $("box").focus();
  }

  // One turn with the agent. `shown` is what appears in the log when it differs
  // from what is sent (an upload sends a sentence but shows the file name).
  async function converse(text, shown) {
    setBusy(true);
    addMessage(shown || text, "me");
    const waiting = addMessage("Thinking…", "note");
    try {
      const reply = await send(text);
      sessionId = reply.session_id;
      waiting.remove();
      if (reply.replies.length === 0) addMessage("(No reply. Try rephrasing.)", "note");
      for (const r of reply.replies) addMessage(r.text, "", r.author.replaceAll("_", " "));
    } catch (error) {
      waiting.remove();
      addMessage(error.message, "err");
    } finally {
      setBusy(false);
    }
  }

  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = $("box").value.trim();
    if (!text) return;
    $("box").value = "";
    converse(text);
  });

  $("attach").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async () => {
    const file = $("file").files[0];
    $("file").value = "";  // so choosing the same file again still fires
    if (!file) return;
    setBusy(true);
    const waiting = addMessage("Uploading " + file.name + "…", "note");
    let uploaded;
    try {
      uploaded = await uploadResume(file);
    } catch (error) {
      addMessage(error.message, "err");
      return;
    } finally {
      waiting.remove();
      setBusy(false);
    }
    await converse(
      "I just uploaded my resume, " + uploaded.filename +
        " (upload id " + uploaded.upload_id + "). Please read it.",
      "Uploaded " + uploaded.filename,
    );
  });

  $("box").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("form").requestSubmit();
    }
  });

  $("new").addEventListener("click", reset);
  $("out").addEventListener("click", () => signOut(auth));
  $("in").addEventListener("click", async () => {
    $("signin-error").textContent = "";
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (error) {
      if (error.code !== "auth/popup-closed-by-user") {
        $("signin-error").textContent =
          "Could not sign in (" + (error.code || "unknown error") + ").";
      }
    }
  });

  try {
    const config = await (await fetch("/firebase-config.json")).json();
    auth = getAuth(initializeApp(config));
  } catch (error) {
    $("fatal").textContent = "The page could not start: " + error.message;
    show("fatal", true);
    throw error;
  }

  let view = "chat";

  async function loadFunnel() {
    show("fn-error", false);
    try {
      const res = await fetch("/api/funnel", {
        headers: { Authorization: "Bearer " + await idToken() },
      });
      if (!res.ok) throw await failure(res, "Could not load your applications.");
      const data = await res.json();
      const empty = data.total === 0;
      show("fn-empty", empty);
      show("fn-svg", !empty);
      $("fn-stats").replaceChildren();
      if (empty) { $("fn-svg").replaceChildren(); return; }
      HHFunnel.render($("fn-svg"), data);
      for (const [label, value, note] of HHFunnel.stats(data)) {
        const card = document.createElement("div");
        card.className = "fn-stat";
        for (const [tag, text] of [["span", label], ["strong", value], ["small", note]]) {
          const el = document.createElement(tag);
          el.textContent = text;
          card.appendChild(el);
        }
        $("fn-stats").appendChild(card);
      }
    } catch (error) {
      $("fn-error").textContent = error.message;
      show("fn-error", true);
    }
  }

  function layout() {
    const user = auth.currentUser;
    show("app", !!user && view === "chat");
    show("funnel", !!user && view === "funnel");
    show("new", !!user && view === "chat");
    $("tab-chat").setAttribute("aria-pressed", String(view === "chat"));
    $("tab-funnel").setAttribute("aria-pressed", String(view === "funnel"));
  }

  $("tab-chat").addEventListener("click", () => { view = "chat"; layout(); $("box").focus(); });
  $("tab-funnel").addEventListener("click", () => { view = "funnel"; layout(); loadFunnel(); });
  $("fn-replay").addEventListener("click", () => HHFunnel.replay($("fn-svg")));

  onAuthStateChanged(auth, (user) => {
    show("signin", !user);
    show("tabs", !!user);
    show("out", !!user);
    $("who").textContent = user ? (user.email || user.displayName || "") : "";
    view = "chat";
    layout();
    if (user) { reset(); $("box").focus(); }
  });
</script>
</body>
</html>
