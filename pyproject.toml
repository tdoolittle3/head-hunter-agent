[project]
name = "head-hunter-agent"
version = "0.1.0"
description = "An AI agent that learns your career and helps you land a job."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.9.1",
    "pydantic>=2.13",
    "python-docx>=1.2",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["head_hunter*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "D",   # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]  # test functions carry their intent in the name

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import head_hunter, and the package is not installed in CI.
# Without this, bare `pytest` only finds it when the repo root happens to be on
# sys.path -- which `python -m pytest` does implicitly and `pytest` does not.
pythonpath = ["."]
